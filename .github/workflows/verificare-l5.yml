name: Verificarea L5

on:
  push:
    paths:
      - "notebooks/**"
      - ".github/workflows/verificare-l5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificare:
    name: Notebook-ul L5, rulat de la zero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bibliotecile notebook-ului
        run: pip install --quiet jupyter nbconvert ipykernel pandas numpy matplotlib

      - name: Verificările (notebook, rulare de la zero, parametri, date, grafic, formulă, PNG)
        shell: bash
        run: python3 tests/check_l5.py all --executa | tee -a "$GITHUB_STEP_SUMMARY"
